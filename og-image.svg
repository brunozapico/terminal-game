<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Terminal Quest — Learn by using the terminal</title>
  <desc id="description">A dark terminal-inspired card for Terminal Quest, a safe game for learning macOS and Linux commands.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080a0d"/>
      <stop offset="1" stop-color="#101820"/>
    </linearGradient>
    <radialGradient id="glow" cx="84%" cy="4%" r="55%">
      <stop offset="0" stop-color="#83d5a2" stop-opacity=".18"/>
      <stop offset="1" stop-color="#83d5a2" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#000000" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="58" y="48" width="1084" height="534" rx="26" fill="#0d1014" stroke="#34404b" filter="url(#shadow)"/>
  <rect x="94" y="88" width="52" height="52" rx="13" fill="#10151a" stroke="#34404b"/>
  <text x="120" y="124" fill="#83d5a2" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="20" font-weight="700" text-anchor="middle">&gt;_</text>
  <text x="166" y="123" fill="#f1f4f6" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="27" font-weight="700">Terminal Quest</text>
  <text x="96" y="236" fill="#f1f4f6" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="62" font-weight="700" letter-spacing="-2">Learn the terminal</text>
  <text x="96" y="302" fill="#83d5a2" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="62" font-weight="700" letter-spacing="-2">by using the terminal.</text>
  <rect x="96" y="365" width="1008" height="132" rx="14" fill="#080b0e" stroke="#242b33"/>
  <circle cx="126" cy="397" r="6" fill="#9b6767"/>
  <circle cx="148" cy="397" r="6" fill="#a18c5e"/>
  <circle cx="170" cy="397" r="6" fill="#648f72"/>
  <text x="108" y="444" fill="#83d5a2" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="21">$ pwd</text>
  <text x="214" y="444" fill="#b8c5cc" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="21">/home/you</text>
  <text x="108" y="476" fill="#66727d" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16">safe simulation · macOS + Linux · 66 challenges</text>
  <text x="96" y="548" fill="#8e9aa5" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17">A hands-on path from pwd to remote servers.</text>
</svg>
